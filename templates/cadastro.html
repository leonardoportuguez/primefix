{% extends "base.html" %}
{% block title %}PrimeFix - Cadastro{% endblock %}

{% block content %}
<section class="form-section">
    <h2>Criar conta</h2>
    <form method="POST" action="{{ url_for('cadastro') }}">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required>

                <label for="senha">Senha</label>
        <!-- Campo de senha + botão de olho pra mostrar/ocultar o texto digitado.
             O input-group do Bootstrap junta o campo e o botão visualmente -->
        <div class="input-group">
          <input type="password" id="senha" name="senha" class="form-control" required>
          <button type="button" class="btn btn-outline-secondary"
                  onclick="alternarSenha('senha', this)" tabindex="-1">
            <i class="bi bi-eye"></i>
          </button>
        </div>
        <label for="role">Você é:</label>
        <select id="role" name="role" required>
            <option value="client">Cliente</option>
            <option value="technician">Técnico</option>
        </select>

        <button type="submit" class="btn btn-primary">Cadastrar</button>
    </form>
       <p>Já tem conta? <a href="{{ url_for('login') }}">Entrar</a></p>
</section>

<!-- Script reutilizável: alterna o campo de senha entre "password"
     (oculto) e "text" (visível), trocando também o ícone do olho.
     Recebe o id do input e o próprio botão clicado -->
<script>
function alternarSenha(inputId, botao) {
  const input = document.getElementById(inputId);
  const icone = botao.querySelector('i');

  if (input.type === 'password') {
    input.type = 'text';
    icone.classList.remove('bi-eye');
    icone.classList.add('bi-eye-slash');
  } else {
    input.type = 'password';
    icone.classList.remove('bi-eye-slash');
    icone.classList.add('bi-eye');
  }
}
</script>
{% endblock %}
